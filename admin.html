<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BAWO Foundation</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .dashboard {
            display: none;
        }

        .content-item {
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-item-details h4 {
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }

        .content-item-details p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 500px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        .logout-btn {
            float: right;
            cursor: pointer;
            color: var(--primary-blue);
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <img src="assets/logo.png" alt="BAWO Foundation Logo">
                    <span>Admin Dashboard</span>
                </a>
                <div class="nav-links">
                    <a href="#" id="logout-btn" style="display: none;">Logout</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <!-- Login Section -->
        <div id="login-section" class="login-box">
            <h2 class="text-center">Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="dashboard">
            <div class="tabs" style="margin-bottom: 2rem; border-bottom: 2px solid #ddd; display: flex; gap: 2rem;">
                <button class="tab-btn active" onclick="switchTab('content')"
                    style="background: none; border: none; padding: 1rem 0; font-weight: 600; cursor: pointer; border-bottom: 3px solid var(--accent-teal); color: var(--primary-blue);">Site
                    Content</button>
                <button class="tab-btn" onclick="switchTab('submissions')"
                    style="background: none; border: none; padding: 1rem 0; font-weight: 600; cursor: pointer; color: #666;">View
                    Submissions</button>
            </div>

            <!-- Content Tab -->
            <div id="content-tab">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>Site Content</h2>
                </div>
                <div id="content-list">
                    <p>Loading content...</p>
                </div>
            </div>

            <!-- Submissions Tab -->
            <div id="submissions-tab" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>User Submissions</h2>
                </div>
                <div id="submissions-list">
                    <p>Loading submissions...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Edit Content</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-key">
                <div class="form-group">
                    <label>Title (Optional)</label>
                    <input type="text" id="edit-title" placeholder="Enter section title">
                </div>
                <div class="form-group">
                    <label>Body Text / Content</label>
                    <textarea id="edit-value" rows="6"></textarea>
                </div>
                <div class="form-group">
                    <label>Update Image / Media</label>
                    <input type="file" id="edit-image" accept="image/*">
                    <small style="color: #666">Leave empty to keep current image.</small>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const contentTab = document.getElementById('content-tab');
            const submissionsTab = document.getElementById('submissions-tab');
            const tabs = document.querySelectorAll('.tab-btn');

            if (tab === 'content') {
                contentTab.style.display = 'block';
                submissionsTab.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[0].style.borderBottom = '3px solid var(--accent-teal)';
                tabs[0].style.color = 'var(--primary-blue)';
                tabs[1].classList.remove('active');
                tabs[1].style.borderBottom = 'none';
                tabs[1].style.color = '#666';
            } else {
                contentTab.style.display = 'none';
                submissionsTab.style.display = 'block';
                tabs[1].classList.add('active');
                tabs[1].style.borderBottom = '3px solid var(--accent-teal)';
                tabs[1].style.color = 'var(--primary-blue)';
                tabs[0].classList.remove('active');
                tabs[0].style.borderBottom = 'none';
                tabs[0].style.color = '#666';
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>

</html>
